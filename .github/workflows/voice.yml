name: Generate voice clips

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/voice-lines.json', 'tools/make_voice.py']

permissions:
  contents: write

jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - run: pip install -q edge-tts piper-tts
      - name: Make one MP3 per fruit
        run: python tools/make_voice.py
      - name: Commit the clips
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audio
          git commit -m "Add generated British voice clips" || echo "nothing to commit"
          git push
