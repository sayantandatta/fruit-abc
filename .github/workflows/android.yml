name: Build Android APK and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Accept Android SDK licences (the SDK is preinstalled on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Copy the web app into the Android project
        run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../FruitABC.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FruitABC-apk
          path: FruitABC.apk
      - name: Publish APK as the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Fruit ABC (latest build)
          body: "Android APK built from the latest commit. Download FruitABC.apk, open it on the phone or tablet, and allow installing from this source when asked."
          files: FruitABC.apk
          prerelease: false

  pages:
    name: Deploy site to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish docs/ to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          force_orphan: true
