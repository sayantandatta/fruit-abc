<title>Fruit ABC</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: sticky A-Z ribbon on top, then one big picture card with previous/next arrows laid over it,
   then the fruit name, a one-line taste sentence and a "hear it again" button. White by request, one light look. */
:root{
  --bg:#ffffff;
  --ink:#26324a;
  --muted:#5b6785;
  --line:#e4e9f2;
  --c0:#e03131; --c1:#d9480f; --c2:#2b8a3e; --c3:#1c7ed6; --c4:#7048e8; --c5:#c2255c;
  --accent:var(--c0);
  --fruit:#e5484d;
  --font-display:'Fredoka','ui-rounded','Nunito',system-ui,sans-serif;
  --font-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --size:clamp(240px,min(86vw,44vh),440px);
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.ribbon{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:2px solid var(--line)}
.ribbon-inner{position:relative;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-overflow-scrolling:touch}
.ribbon-inner::-webkit-scrollbar{display:none}
.ribbon-inner>:first-child{margin-left:auto}
.ribbon-inner>:last-child{margin-right:auto}
.tile{flex:1 0 48px;max-width:64px;height:58px;border:0;border-radius:18px;cursor:pointer;touch-action:manipulation;
  font:600 28px/1 var(--font-display);color:var(--tc);background:color-mix(in srgb,var(--tc) 12%,#fff);
  transition:transform .18s cubic-bezier(.34,1.56,.64,1),background .15s}
.tile-all{flex:1 0 58px;max-width:78px;font-size:22px}
.tile:active{transform:scale(.93)}
.tile[aria-pressed="true"]{background:var(--tc);color:#fff;transform:translateY(-2px) scale(1.08)}
.tile:focus-visible,.nav:focus-visible,.speak:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

main{display:flex;flex-direction:column;align-items:center;gap:18px;padding-block:18px 36px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hint{margin:0;font-weight:700;font-size:17px;color:var(--muted)}

.stage{position:relative;width:var(--size);height:var(--size);flex:none}
.card{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden;border-radius:40px;
  background:var(--bg);border:3px solid color-mix(in srgb,var(--fruit) 30%,#fff);touch-action:pan-y;cursor:pointer;user-select:none}
.card::before{content:"";position:absolute;width:80%;aspect-ratio:1;border-radius:50%;background:color-mix(in srgb,var(--fruit) 15%,#fff);transition:background .3s}
.chip{position:absolute;left:20px;top:14px;font:700 clamp(28px,8vw,40px)/1 var(--font-display);color:var(--accent)}
.art{position:relative;width:62%;height:62%;display:grid;place-items:center}
.art svg{width:100%;height:100%;display:block}
.emoji{font-size:calc(var(--size)*.44);line-height:1;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
.art.has-photo{width:88%;height:88%}
.card.has-photo::before{display:none}
.card.has-photo{border-color:var(--line)}
.photo{border-radius:28px}
.photo{width:100%;height:100%;object-fit:contain;display:block}
.voicebar{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;color:var(--muted)}
.voicebar select{font:700 15px var(--font-body);color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:8px 10px;max-width:min(60vw,320px)}
.voicenote{margin:0;font-size:13px;font-weight:700;color:var(--muted);text-align:center;max-width:44ch}
.photocredit{margin:6px 0 0;font-size:12px;font-weight:700;color:var(--muted)}
.photocredit a{color:inherit}
.credit{margin:6px 0 0;font-size:13px;font-weight:700;color:var(--muted);text-align:center;max-width:44ch}
.credit a{color:inherit}
.art.pop{animation:pop .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{0%{transform:scale(.35) rotate(-10deg);opacity:0}55%{opacity:1}100%{transform:scale(1) rotate(0)}}

.nav{position:absolute;top:50%;translate:0 -50%;z-index:2;width:clamp(52px,15vw,68px);aspect-ratio:1;border-radius:50%;
  display:grid;place-items:center;cursor:pointer;background:#fff;border:2px solid var(--line);color:var(--ink);
  box-shadow:0 6px 16px rgba(38,50,74,.16);touch-action:manipulation;transition:transform .15s}
.nav:active{transform:scale(.9)}
.nav svg{width:46%;height:46%}
.prev{left:10px}.next{right:10px}

.caption{width:min(92vw,560px);text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.is-for{margin:0;font:600 clamp(18px,5vw,22px)/1.2 var(--font-display);color:var(--muted)}
.name{margin:0;font:700 clamp(38px,11vw,60px)/1.05 var(--font-display);text-wrap:balance}
.ini{color:var(--accent)}
.aka{margin:0;font-weight:700;font-size:16px;color:var(--muted)}
.taste{margin:8px 0 0;font-weight:700;font-size:clamp(20px,5.4vw,26px);line-height:1.35;max-width:28ch;text-wrap:balance}

.speak{display:inline-flex;align-items:center;gap:12px;height:64px;padding:0 30px;border:0;border-radius:999px;cursor:pointer;
  background:var(--accent);color:#fff;font:600 20px/1 var(--font-display);touch-action:manipulation;transition:transform .15s,background .2s}
.speak:active{transform:scale(.95)}
.speak svg{width:28px;height:28px}
.speak.speaking svg{animation:talk .7s ease-in-out infinite}
@keyframes talk{50%{transform:scale(1.2)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header class="ribbon">
  <h1 class="sr">Fruit ABC</h1>
  <nav class="ribbon-inner" id="ribbon" aria-label="Alphabet"></nav>
</header>
<main>
  <p class="hint" id="hint">Tap a letter, or All, to meet a fruit</p>
  <section class="stage" aria-label="Fruit picture">
    <div class="card" id="card"><div class="chip" id="chip" aria-hidden="true">Aa</div><div class="art" id="art"></div></div>
    <button class="nav prev" id="prev" type="button" aria-label="Previous fruit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4l-8 8 8 8"/></svg></button>
    <button class="nav next" id="next" type="button" aria-label="Next fruit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4l8 8-8 8"/></svg></button>
  </section>
  <section class="caption" aria-live="polite">
    <p class="is-for" id="isfor"></p>
    <h2 class="name" id="name"></h2>
    <p class="aka" id="aka" hidden></p>
    <p class="taste" id="taste"></p>
    <p class="photocredit" id="photocredit" hidden></p>
  </section>
  <button class="speak" id="speak" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg><span>Hear it again</span></button>
  <div class="voicebar" id="voicebar"><label for="voicesel">Voice</label><select id="voicesel"></select></div>
  <p class="voicenote" id="voicenote" hidden></p>
  <p class="credit">Photos come from Wikipedia and Wikimedia Commons, with four from the Fruits-360 dataset; each photo is credited under its fruit. Fruits without a photo are drawings.</p>
</main>

/* ---------- Sentence ---------- */
const PROPER=new Set(['Honeycrisp','Indian','Indonesian','Java','Bing','Queen','Anne','Nashi','Ogeechee','Ugli','Uniq','Ugni','Ximenia','Voavanga','Xigua','Xango','Yunnan','Zinfandel','Quararibea']);
const lc=s=>s.split(' ').map(w=>PROPER.has(w)?w:w.toLowerCase()).join(' ');
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const article=n=>(/^[AEIOU]/i.test(n)&&!/^Uniq/i.test(n))?'an':'a';
function sentence(f,forSpeech){
  if(f.sent)return f.sent;
  const noun=lc((forSpeech&&f.say)||f.n);
  const end=/[.!?]$/.test(f.t)?'':'.';
  return cap(`${article(f.n)} ${noun} tastes ${f.t}${end}`);
}

  const n=parseInt(hex.slice(1),16);let r=n>>16,g=(n>>8)&255,b=n&255;

  r=Math.round((t-r)*p+r);g=Math.round((t-g)*p+g);b=Math.round((t-b)*p+b);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

      b=lv+`<ellipse cx="100" cy="112" rx="44" ry="58" ${fill}/>`+[[100,70,0],[78,100,-35],[122,100,35],[84,138,-25],[116,138,25]].map(([x,y,r])=>`<ellipse cx="${x}" cy="${y}" rx="6" ry="14" transform="rotate(${r} ${x} ${y})" fill="#5cb85c" stroke="#2e7d32" stroke-width="2"/>`).join('')+shine(80,84,8,18);break;}
    case 'cherries':
      b=`<path d="M72 108Q82 62 108 40" fill="none" stroke="#7a5a3a" stroke-width="5" stroke-linecap="round"/><path d="M132 118Q128 70 108 40" fill="none" stroke="#7a5a3a" stroke-width="5" stroke-linecap="round"/><circle cx="72" cy="144" r="36" ${fill}/><circle cx="132" cy="150" r="34" ${fill}/>`+shine(58,130,6,14)+shine(118,136,6,14)+leaf(108,44);break;
  }
  const sc=a.s||1;
  return `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${label}">${defs}<g transform="translate(100 100) scale(${sc}) translate(-100 -100)">${b}</g></svg>`;
}

/* ---------- Voice (British English) ---------- */
const synth='speechSynthesis' in window?window.speechSynthesis:null;
let voice=null,speakTok=0;
const speakBtn=document.getElementById('speak');
const isUK=v=>/^en[-_]GB/i.test(v.lang)||/united kingdom|british/i.test(v.name);
const rank=v=>{const n=v.name;let s=0;
  if(/google uk english female/i.test(n))s-=10;
  if(/google uk english male/i.test(n))s-=9;
  if(/sonia|libby|ryan|mia|abbi|alfie|bella|elliot|ethan|hollie|maisie|noah|oliver|olivia|thomas/i.test(n)&&/online|natural|neural/i.test(n))s-=8;
  if(/hazel|susan|george/i.test(n))s-=6;
  if(/daniel|kate|serena|stephanie|martha|arthur|jamie|moira|fiona/i.test(n))s-=5;
  if(/natural|premium|enhanced|online/i.test(n))s-=2;
  if(/siri/i.test(n))s+=1;
  return s;};
function buildVoiceMenu(uk,en){
  const sel=document.getElementById('voicesel'),note=document.getElementById('voicenote');
  if(!sel)return;
  const opt=v=>`<option value="${v.name.replace(/"/g,'&quot;')}"${voice&&v.name===voice.name?' selected':''}>${v.name}</option>`;
  const rest=en.filter(v=>!uk.includes(v));
  sel.innerHTML=(uk.length?`<optgroup label="British English">${uk.map(opt).join('')}</optgroup>`:'')+(rest.length?`<optgroup label="Other English">${rest.map(opt).join('')}</optgroup>`:'');
  note.hidden=uk.length>0;
  note.hidden=false;note.textContent=uk.length?`Using the ${voice?voice.name:''} voice (${voice?voice.lang:''}). Pick another above if it sounds off.`:"No British English voice was found on this device, so another English voice is used. Adding a British voice in the device's speech settings will fix this.";
}
function pickVoice(){
  if(!synth)return;
  const all=synth.getVoices();if(!all.length)return;
  const en=all.filter(v=>/^en[-_]/i.test(v.lang)||isUK(v));
  const uk=en.filter(isUK).sort((a,b)=>rank(a)-rank(b));
  let saved=null;try{saved=localStorage.getItem('fruitabc-voice');}catch(e){}
  voice=en.find(v=>v.name===saved)||uk[0]||en[0]||null;
  buildVoiceMenu(uk,en);
}
if(synth){pickVoice();synth.addEventListener?.('voiceschanged',pickVoice);}
else{const vb=document.getElementById('voicebar');if(vb)vb.hidden=true;}
document.getElementById('voicesel').addEventListener('change',e=>{
  const v=synth&&synth.getVoices().find(x=>x.name===e.target.value);if(!v)return;
  voice=v;try{localStorage.setItem('fruitabc-voice',v.name);}catch(err){}
  speak(current());
});
function speak(f){
  if(!synth)return;
  if(!voice)pickVoice();
  const tok=++speakTok;
  synth.cancel();
  const name=f.say||f.n;
  /* The fruit name is said twice: once in the sentence, then again on its own and more slowly */
  const parts=[[`${SAY[f.l]} is for ${name}.`,.72],[`${name}.`,.62],[sentence(f,true),.8]];
  const us=parts.map(([t,r])=>{const u=new SpeechSynthesisUtterance(t);if(voice)u.voice=voice;u.lang=voice?voice.lang:'en-GB';u.rate=r;u.pitch=1;return u;});
  const done=()=>{if(tok===speakTok)speakBtn.classList.remove('speaking');};
  us.forEach(u=>{u.onerror=done;});
  us[us.length-1].onend=done;
  speakBtn.classList.add('speaking');
  us.forEach(u=>synth.speak(u));
}

/* ---------- Picking fruits: a shuffled bag per letter, so every tap is a fresh random fruit with that letter ---------- */
const bag={},lastDrawn={},H={};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function draw(L){
  if(!bag[L]||!bag[L].length){
    bag[L]=shuffle(BY[L].slice());
    const n=bag[L].length;
    if(n>1&&bag[L][n-1]===lastDrawn[L])[bag[L][n-1],bag[L][0]]=[bag[L][0],bag[L][n-1]];
  }
  return lastDrawn[L]=bag[L].pop();
}

/* ---------- UI ---------- */
const $=id=>document.getElementById(id);
const root=document.documentElement,ribbon=$('ribbon'),art=$('art'),card=$('card');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let cur='A';
const tiles=['ALL'].concat(LETTERS).map((L,k)=>{
  const all=L==='ALL';
  const t=document.createElement('button');
  t.type='button';t.className='tile'+(all?' tile-all':'');t.textContent=all?'All':L;t.dataset.l=L;
  t.style.setProperty('--tc',all?'var(--ink)':`var(--c${(k-1)%6})`);
  t.setAttribute('aria-label',all?'All fruits':'Letter '+L);t.setAttribute('aria-pressed','false');
  t.addEventListener('click',()=>{$('hint').hidden=true;selectLetter(L);});
  ribbon.appendChild(t);return t;
});
const current=()=>{const h=H[cur];return h.list[h.i];};

function render(f){
  const L=f.l,i=LETTERS.indexOf(L);
  root.style.setProperty('--accent',`var(--c${i%6})`);
  root.style.setProperty('--fruit',f.col);
  $('chip').textContent=L+L.toLowerCase();
  const photo=PHOTOS[f.n];
  art.className='art'+(photo?' has-photo':'');card.classList.toggle('has-photo',!!photo);
  art.innerHTML=photo?`<img class="photo" src="${photo}" alt="${f.n}" draggable="false">`:f.e?`<span class="emoji" role="img" aria-label="${f.n}">${f.e}</span>`:artSVG(f.art,f.n);
  void art.offsetWidth;art.classList.add('pop');
  $('isfor').textContent=`${L} is for`;
  $('name').innerHTML=`<span class="ini">${f.n.charAt(0)}</span>${f.n.slice(1)}`;
  const aka=$('aka');aka.hidden=!f.aka;aka.textContent=f.aka||'';
  $('taste').textContent=sentence(f);
  const cr=CREDITS[f.n],pc=$('photocredit');pc.hidden=!cr;if(cr){const who=cr.by?cr.by+', ':'';pc.innerHTML=cr.file?`Photo: ${who}${cr.lic}, via <a href="https://commons.wikimedia.org/wiki/File:${encodeURIComponent(cr.file)}" target="_blank" rel="noopener">Wikimedia Commons</a>`:`Photo: ${who}${cr.lic}`;}
  tiles.forEach(t=>t.setAttribute('aria-pressed',String(t.dataset.l===cur)));
  const t=tiles.find(x=>x.dataset.l===cur);
  ribbon.scrollTo({left:t.offsetLeft-(ribbon.clientWidth-t.offsetWidth)/2,behavior:reduce?'auto':'smooth'});
}
function selectLetter(L,quiet){
  const h=H[L]||(H[L]={list:[],i:-1});
  h.list.push(draw(L));if(h.list.length>30)h.list.shift();
  h.i=h.list.length-1;cur=L;
  render(current());if(!quiet)speak(current());
}
function step(dir){
  const h=H[cur];
  if(dir>0){
    if(h.i<h.list.length-1)h.i++;
    else{h.list.push(draw(cur));if(h.list.length>30)h.list.shift();h.i=h.list.length-1;}
  }else if(h.i>0){h.i--;}
  else{let f;do{f=draw(cur);}while(f===h.list[0]&&BY[cur].length>1);h.list.unshift(f);h.i=0;}
  render(current());speak(current());
}
$('prev').addEventListener('click',()=>step(-1));
$('next').addEventListener('click',()=>step(1));
speakBtn.addEventListener('click',()=>speak(current()));

/* Swipe the picture to change fruit, tap it to hear it again */
let sx=null;
card.addEventListener('pointerdown',e=>{sx=e.clientX;});
card.addEventListener('pointerup',e=>{
  if(sx===null)return;const dx=e.clientX-sx;sx=null;
  if(Math.abs(dx)>50)step(dx<0?1:-1);else if(Math.abs(dx)<10)speak(current());
});
card.addEventListener('pointercancel',()=>{sx=null;});

document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==='ArrowRight')step(1);
  else if(e.key==='ArrowLeft')step(-1);
  else if(/^[a-z]$/i.test(e.key)){$('hint').hidden=true;selectLetter(e.key.toUpperCase());}
});

selectLetter('A',true);
</script>
